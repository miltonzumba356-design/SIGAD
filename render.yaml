services:
  # Front-end (React/Vite) está hospedado no Vercel — https://sigad-ten.vercel.app
  # Este blueprint cobre apenas o backend (Render), incluindo os valores de CORS/FRONTEND_URL
  # necessários para aceitar pedidos vindos do Vercel.
  - name: sigad-1
    type: web
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run init-db && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./database/sigad.db
      - key: UPLOAD_PATH
        value: ./uploads
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_SQL
        value: "false"
      - key: FRONTEND_URL
        value: https://sigad-ten.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://sigad-ten.vercel.app
